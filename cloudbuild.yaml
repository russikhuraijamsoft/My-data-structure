# ==============================================================================
# TalkOS Restaurant Enterprise ERP - Google Cloud Build CI/CD Pipeline
# Continuous Integration and Deployment to Google Cloud Run
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Install dependencies and verify code integrity
  # ----------------------------------------------------------------------------
  - name: 'node:22-slim'
    id: 'test-and-lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npm run lint
        npm test
        npm run build

  # ----------------------------------------------------------------------------
  # Step 2: Build container image using Docker
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 3: Push container image to Google Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}'

  # ----------------------------------------------------------------------------
  # Step 4: Deploy container to Google Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--concurrency'
      - '80'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '300s'
      - '--set-env-vars'
      - 'NODE_ENV=production,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},VITE_FIREBASE_DATABASE_ID=${_FIRESTORE_DB_ID}'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'

substitutions:
  _REGION: 'asia-southeast1'
  _REPO_NAME: 'talkos'
  _SERVICE_NAME: 'talkos-enterprise-erp'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _FIRESTORE_DB_ID: 'ai-studio-talkosarchitectu-438c4707-59bb-4b28-aa84-26b8ca15c574'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
